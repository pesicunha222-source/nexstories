<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audifort Official Website - Verification Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            /* Puxa a imagem do print que você vai subir nesta mesma pasta */
            background: url('fundo-oficial.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
        }

        .container {
            background: rgba(255, 255, 255, 0.94);
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .secure-badge {
            color: #27ae60;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            color: #1a252f;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        p {
            color: #5a6c7d;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-redirect {
            display: block;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-redirect:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(46, 204, 113, 0.6);
        }

        .terms-text {
            margin-top: 15px;
            font-size: 11px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="secure-badge">
            🔒 OFFICIAL VERIFICATION PORTAL
        </div>
        
        <h1>Verify Your Access To The Official Audifort Website</h1>
        
        <p>Click below to verify stock availability, secure active manufacturer discounts, and guarantee your secure checkout window.</p>
        
        <!-- Aponta para a pasta de redirecionamento que criamos no Passo 1 -->
        <a href="../go/" class="btn-redirect">Agree & Continue</a>
        
        <div class="terms-text">
            You will be securely forwarded to the official manufacturer's page.
        </div>
    </div>

</body>
</html>
